<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg-1: #0a0d13;
    --bg-2: #131722;
    --bg-3: #0d1520;
    --ink: #e7ecf3;
    --ink-muted: #7c8798;
    --accent: #B69678;
    --accent-soft: rgba(182,150,120,0.14);
    --pill-fill: rgba(255,255,255,0.035);
    --pill-fill-strong: rgba(255,255,255,0.055);
    --pill-border: rgba(255,255,255,0.09);
    --pill-shadow: 0 6px 18px rgba(0,0,0,0.35);
    --pill-shadow-hover: 0 10px 26px rgba(0,0,0,0.45), 0 0 0 1px var(--accent-soft), 0 0 22px rgba(182,150,120,0.10);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    color: var(--ink);
    background-color: var(--bg-1);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(182,150,120,0.07), transparent 40%),
      radial-gradient(circle at 82% 88%, rgba(124,140,255,0.07), transparent 42%),
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 55%, var(--bg-3) 100%);
    background-size: auto, auto, 22px 22px, auto;
    background-attachment: fixed;
    display:flex;
    justify-content:center;
    padding: 44px 16px 80px;
  }

  .page{
    width:100%;
    max-width: 480px;
  }

  .section{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-bottom: 10px;
  }

  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 16px 22px;
    border-radius: 10px;
    border: 1px solid var(--pill-border);
    box-shadow: var(--pill-shadow);
  }

  .header-pill{
    background: var(--pill-fill-strong);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .header-pill::before{
    content: "// ";
    color: var(--accent);
    font-weight: 500;
  }

  .link-pill{
    background: var(--pill-fill);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--ink-muted);
    text-decoration:none;
    cursor:pointer;
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
    word-break: break-word;
  }

  .link-pill:hover,
  .link-pill:focus-visible{
    transform: translateY(-2px);
    box-shadow: var(--pill-shadow-hover);
    background: var(--pill-fill-strong);
    color: var(--ink);
    border-color: rgba(182,150,120,0.35);
  }
  .link-pill:active{
    transform: translateY(0);
  }
  .link-pill:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px 22px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--pill-border);
    background: var(--pill-fill);
    box-shadow: var(--pill-shadow);
  }
  .divider span{
    width:100%;
    border-top: 2px dashed rgba(182,150,120,0.28);
  }

  @media (max-width: 380px){
    .pill{
      padding: 14px 16px;
      font-size: 12px;
    }
    body{ padding: 32px 12px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    .link-pill{ transition: none; }
  }
</style>
</head>

  const main = document.getElementById('linklist');
  let currentSection = null;

  data.forEach(item => {
    if (item.type === 'header') {
      currentSection = document.createElement('div');
      currentSection.className = 'section';
      const h = document.createElement('div');
      h.className = 'pill header-pill';
      h.textContent = item.text;
      currentSection.appendChild(h);
      main.appendChild(currentSection);
    } else if (item.type === 'link') {
      const a = document.createElement('a');
      a.className = 'pill link-pill';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = item.label;
      (currentSection || main).appendChild(a);
    } else if (item.type === 'divider') {
      const d = document.createElement('div');
      d.className = 'divider';
      d.innerHTML = '<span></span>';
      main.appendChild(d);
      currentSection = null;
    }
