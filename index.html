  .page{
    width:100%;
    max-width: 480px;
  }

  .section{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-bottom: 10px;
  }

  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 16px 22px;
    border-radius: 10px;
    border: 1px solid var(--pill-border);
    box-shadow: var(--pill-shadow);
  }

  .header-pill{
    background: var(--pill-fill-strong);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .header-pill::before{
    content: "// ";
    color: var(--accent);
    font-weight: 500;
  }

  .link-pill{
    background: var(--pill-fill);
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--ink-muted);
    text-decoration:none;
    cursor:pointer;
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
    word-break: break-word;
  }

  .link-pill:hover,
  .link-pill:focus-visible{
    transform: translateY(-2px);
    box-shadow: var(--pill-shadow-hover);
    background: var(--pill-fill-strong);
    color: var(--ink);
    border-color: rgba(237,188,145,0.35);
  }
  .link-pill:active{
    transform: translateY(0);
  }
  .link-pill:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px 22px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--pill-border);
    background: var(--pill-fill);
    box-shadow: var(--pill-shadow);
  }
  .divider span{
    width:100%;
    border-top: 2px dashed rgba(237,188,145,0.28);
  }

  .footer{
    text-align:center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.01em;
  }
  .footer a{
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .footer a:hover,
  .footer a:focus-visible{
    text-decoration: underline;
  }

  @media (max-width: 380px){
    .pill{
      padding: 14px 16px;
      font-size: 12px;
    }
    body{ padding: 32px 12px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    .link-pill{ transition: none; }
  }
